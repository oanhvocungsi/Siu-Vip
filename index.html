<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SIU VIP - Hệ Thống Điểm Danh & Lớp Học</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-accent: #2563eb;
      --primary-light: #3b82f6;
      --neon-cyan: #38bdf8;
      --bg-dark: #070d18;
      --card-bg: rgba(255, 255, 255, 0.95);
      --card-border: rgba(255, 255, 255, 0.8);
      --card-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.45), 0 0 40px rgba(37, 99, 235, 0.15);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 15%, #1e1b4b 0%, #0c1222 55%, var(--bg-dark) 100%);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
      padding: 20px 16px;
    }

    /* Lưới Cyber đa tầng ánh sáng */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(56, 189, 248, 0.12) 0%, transparent 60%),
        linear-gradient(rgba(59, 130, 246, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59, 130, 246, 0.05) 1px, transparent 1px);
      background-size: 100% 100%, 36px 36px, 36px 36px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 10;
    }

    /* ========================================================
       MASCOT COMPONENT - CHUYỂN ĐỘNG LINH HOẠT 60FPS
       ======================================================== */
    .mascot-stage {
      position: relative;
      width: 250px;
      height: 250px;
      margin: 0 auto -28px auto;
      z-index: 20;
      pointer-events: none;
      will-change: transform;
      animation: catBreath 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      transform-origin: bottom center;
    }

    @keyframes catBreath {
      0%, 100% {
        transform: translateY(0px) scale(1, 1);
      }
      50% {
        transform: translateY(-4px) scale(1.012, 0.992);
      }
    }

    .mascot-squash {
      transform: scale(1.04, 0.95) translateY(3px) !important;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .mascot-inner {
      position: relative;
      width: 100%;
      height: 100%;
      will-change: transform;
      transform-origin: 50% 75%;
    }

    /* Các tư thế lớp sprite - Cross-fade mượt bằng opacity 180ms */
    .sprite-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.18s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: opacity;
    }

    .sprite-layer.active {
      opacity: 1;
    }

    /* ĐÔI MẮT NHÌN THEO - TỈ LỆ CHUẨN 1024x1024 ĐÃ ĐO ĐẠC PIXEL */
    .eye-layer-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
      transition: opacity 0.15s ease;
    }

    .eye-socket {
      position: absolute;
      width: 10.15%;  /* 104px / 1024px */
      height: 10.15%; /* 104px / 1024px */
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    /* Tâm mắt trái (412, 442) -> left: 412 - 52 = 360 (35.15%), top: 442 - 52 = 390 (38.08%) */
    .eye-socket.left {
      left: 35.15%;
      top: 38.08%;
    }

    /* Tâm mắt phải (612, 442) -> left: 612 - 52 = 560 (54.68%), top: 38.08% */
    .eye-socket.right {
      left: 54.68%;
      top: 38.08%;
    }

    .iris-pupil {
      position: absolute;
      width: 80%;
      height: 80%;
      object-fit: contain;
      will-change: transform;
      transform: translate3d(0, 0, 0);
      filter: drop-shadow(0 0 2px rgba(30, 58, 138, 0.45));
      border-radius: 50%;
    }

    /* ========================================================
       LOGIN CARD GLASSMORPHISM HIỆN ĐẠI
       ======================================================== */
    .card {
      background: var(--card-bg);
      border-radius: 32px;
      box-shadow: var(--card-shadow);
      padding: 40px 32px 32px 32px;
      backdrop-filter: blur(20px);
      border: 1.5px solid var(--card-border);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
    }

    .card-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 26px;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(37, 99, 235, 0.08);
      border: 1px solid rgba(37, 99, 235, 0.18);
      padding: 6px 16px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    .brand-badge img {
      width: 22px;
      height: 22px;
      object-fit: contain;
    }

    .brand-badge span {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--primary-accent);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .card-header h1 {
      font-size: 23px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.6px;
    }

    .card-header p {
      font-size: 13.5px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-group label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 7px;
    }

    .input-group label .badge-req {
      font-size: 11px;
      color: #94a3b8;
      font-weight: 500;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper input {
      width: 100%;
      height: 52px;
      padding: 0 18px;
      border-radius: 16px;
      border: 1.5px solid #e2e8f0;
      background: #f8fafc;
      font-size: 15px;
      font-weight: 600;
      color: #0f172a;
      outline: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .input-wrapper input:focus {
      border-color: var(--primary-accent);
      background: #ffffff;
      box-shadow: 0 0 0 4.5px rgba(37, 99, 235, 0.14);
    }

    .remember-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      font-size: 13.5px;
      color: #475569;
    }

    .remember-label {
      display: flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      user-select: none;
      font-weight: 500;
    }

    .remember-label input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--primary-accent);
      cursor: pointer;
      border-radius: 6px;
    }

    .btn-submit {
      width: 100%;
      height: 54px;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: white;
      border: none;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 10px 24px -4px rgba(37, 99, 235, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px -4px rgba(37, 99, 235, 0.55);
    }

    .btn-submit:active {
      transform: translateY(1px);
    }

    .btn-submit:disabled {
      opacity: 0.75;
      cursor: not-allowed;
      transform: none;
    }

    /* Hiệu ứng tia chạy và vạch tốc độ */
    .loading-notice {
      display: none;
      margin-top: 18px;
      text-align: center;
      font-size: 13.5px;
      color: var(--primary-accent);
      font-weight: 700;
      animation: pulseNotice 1.4s ease-in-out infinite;
    }

    @keyframes pulseNotice {
      0%, 100% { opacity: 0.6; transform: scale(0.99); }
      50% { opacity: 1; transform: scale(1.01); }
    }

    .error-msg {
      display: none;
      margin-top: 14px;
      padding: 12px 16px;
      background: #fef2f2;
      border: 1px solid #fee2e2;
      border-radius: 14px;
      color: #dc2626;
      font-size: 13px;
      text-align: center;
      font-weight: 600;
    }

    .shake {
      animation: shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    @keyframes shake {
      10%, 90% { transform: translate3d(-3px, 0, 0); }
      20%, 80% { transform: translate3d(5px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-7px, 0, 0); }
      40%, 60% { transform: translate3d(7px, 0, 0); }
    }

    /* ========================================================
       CYBER TRANSITION SCREEN CHUYÊN NGHIỆP
       ======================================================== */
    #cyber-screen {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle at center, #0f172a 0%, #030712 100%);
      z-index: 100;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #cyber-screen.active {
      display: flex;
      opacity: 1;
    }

    .cyber-portal {
      position: relative;
      width: 260px;
      height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cyber-ring {
      position: absolute;
      border-radius: 50%;
      border: 2px dashed rgba(56, 189, 248, 0.35);
      animation: spinRing 16s linear infinite;
    }

    .cyber-ring.r1 { width: 100%; height: 100%; }
    .cyber-ring.r2 { 
      width: 130%; height: 130%; 
      border-style: dotted; 
      border-color: rgba(99, 102, 241, 0.3); 
      animation-duration: 24s; 
      animation-direction: reverse; 
    }

    @keyframes spinRing {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .cyber-core-btn {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1e293b, #090e17);
      border: 3px solid var(--neon-cyan);
      box-shadow: 0 0 45px rgba(56, 189, 248, 0.45), inset 0 0 25px rgba(56, 189, 248, 0.35);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 10;
      outline: none;
    }

    .cyber-core-btn:hover {
      box-shadow: 0 0 65px rgba(56, 189, 248, 0.8), inset 0 0 35px rgba(56, 189, 248, 0.6);
      transform: scale(1.06);
    }

    .cyber-core-btn:active {
      transform: scale(0.92);
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.7);
    }

    .cyber-core-btn img {
      width: 80%;
      height: 80%;
      object-fit: contain;
      pointer-events: none;
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.6));
    }

    .cyber-guide {
      position: absolute;
      right: -135px;
      bottom: -35px;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }

    .cyber-bubble {
      background: #ffffff;
      color: #0f172a;
      font-size: 13.5px;
      font-weight: 800;
      padding: 7px 16px;
      border-radius: 999px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      white-space: nowrap;
      margin-bottom: 6px;
      animation: bubbleFloat 2.2s ease-in-out infinite;
    }

    @keyframes bubbleFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .cyber-cat-pointer {
      width: 100px;
      height: 100px;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.5));
    }

    .shockwave {
      position: absolute;
      border-radius: 50%;
      border: 3.5px solid var(--neon-cyan);
      pointer-events: none;
      animation: explodeWave 0.75s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
    }

    @keyframes explodeWave {
      0% { width: 150px; height: 150px; opacity: 1; }
      100% { width: 1100px; height: 1100px; opacity: 0; border-width: 1px; }
    }

    /* ========================================================
       ATTENDANCE DASHBOARD
       ======================================================== */
    #attendance-screen {
      display: none;
      width: 100%;
      max-width: 620px;
      background: var(--card-bg);
      border-radius: 32px;
      box-shadow: var(--card-shadow);
      padding: 28px 26px;
      z-index: 10;
      position: relative;
      border: 1.5px solid var(--card-border);
    }

    #attendance-screen.active {
      display: block;
      animation: screenEnter 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes screenEnter {
      from { opacity: 0; transform: translateY(12px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .dash-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1.5px solid #f1f5f9;
      padding-bottom: 16px;
      margin-bottom: 18px;
    }

    .dash-title {
      font-size: 19px;
      font-weight: 800;
      color: #0f172a;
    }

    .dash-sub {
      font-size: 13px;
      color: #64748b;
      margin-top: 3px;
      font-weight: 500;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .filter-grid select, .filter-grid input {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      border-radius: 12px;
      border: 1.5px solid #cbd5e1;
      font-size: 13.5px;
      font-weight: 600;
      background: #f8fafc;
      outline: none;
      color: #1e293b;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .stat-badge {
      background: #f8fafc;
      border-radius: 16px;
      padding: 14px 10px;
      text-align: center;
      border: 1.5px solid #e2e8f0;
      transition: transform 0.2s;
    }

    .stat-badge.present { border-color: rgba(16, 185, 129, 0.35); background: #ecfdf5; color: #065f46; }
    .stat-badge.absent-kp { border-color: rgba(239, 68, 68, 0.35); background: #fef2f2; color: #991b1b; }
    .stat-badge.absent-cp { border-color: rgba(245, 158, 11, 0.35); background: #fffbeb; color: #92400e; }

    .stat-num {
      font-size: 22px;
      font-weight: 900;
    }

    .stat-text {
      font-size: 12px;
      font-weight: 700;
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .search-box {
      width: 100%;
      height: 46px;
      padding: 0 16px;
      border-radius: 14px;
      border: 1.5px solid #cbd5e1;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 14px;
      outline: none;
      background: #f8fafc;
    }

    .search-box:focus {
      border-color: var(--primary-accent);
      background: #fff;
    }

    .student-list {
      max-height: 380px;
      overflow-y: auto;
      border-radius: 16px;
      border: 1.5px solid #e2e8f0;
      margin-bottom: 20px;
      background: #ffffff;
    }

    .student-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 18px;
      border-bottom: 1px solid #f1f5f9;
      transition: background 0.15s;
    }

    .student-item:last-child {
      border-bottom: none;
    }

    .student-item:hover {
      background: #f8fafc;
    }

    .student-info {
      display: flex;
      flex-direction: column;
    }

    .stu-name {
      font-size: 14.5px;
      font-weight: 700;
      color: #0f172a;
    }

    .stu-id {
      font-size: 12.5px;
      color: #64748b;
      font-weight: 500;
      margin-top: 1px;
    }

    .attendance-actions {
      display: flex;
      gap: 8px;
    }

    .btn-att {
      padding: 7px 13px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      border: 1.5px solid transparent;
      cursor: pointer;
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-att.kp {
      background: #fee2e2;
      color: #dc2626;
      border-color: #fca5a5;
    }

    .btn-att.kp.active {
      background: #dc2626;
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(220, 38, 38, 0.35);
    }

    .btn-att.cp {
      background: #fef3c7;
      color: #d97706;
      border-color: #fcd34d;
    }

    .btn-att.cp.active {
      background: #d97706;
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(217, 119, 6, 0.35);
    }

    .bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 16px;
      border-top: 1.5px solid #f1f5f9;
    }

    .btn-secondary {
      padding: 11px 18px;
      border-radius: 12px;
      background: #f1f5f9;
      color: #475569;
      font-size: 13.5px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-secondary:hover {
      background: #e2e8f0;
      color: #1e293b;
    }

    .btn-primary-action {
      flex: 1;
      height: 46px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      border-radius: 12px;
      font-size: 14.5px;
      font-weight: 800;
      border: none;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
      transition: all 0.2s;
    }

    .btn-primary-action:hover {
      transform: translateY(-1.5px);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.45);
    }
  </style>
</head>
<body>

  <!-- ==================== MÀN ĐĂNG NHẬP & MASCOT ==================== -->
  <div class="container" id="login-container">
    
    <!-- KHUNG MASCOT ĐA TẦNG CÂN CHỈNH PIXEL HOÀN HẢO -->
    <div class="mascot-stage" id="mascot-stage">
      <div class="mascot-inner" id="mascot-inner">
        <!-- Lớp nền mắt trống (chuẩn 1024x1024) -->
        <img src="assets/cat-chinh-dien-khong-mat-transparent.png" id="layer-noeyes" class="sprite-layer active" alt="Mascot Base">
        
        <!-- Đôi tròng mắt anime nhìn theo mượt 60fps -->
        <div class="eye-layer-container" id="eye-container">
          <div class="eye-socket left">
            <img src="assets/cat-trong-den-anime.png" class="iris-pupil" id="iris-left" alt="Left Iris">
          </div>
          <div class="eye-socket right">
            <img src="assets/cat-trong-den-anime.png" class="iris-pupil" id="iris-right" alt="Right Iris">
          </div>
        </div>

        <!-- Các tư thế sprite phụ cross-fade mượt mà -->
        <img src="assets/cat-chinh-dien-nham-mat-transparent.png" id="layer-closed" class="sprite-layer" alt="Blink">
        <img src="assets/cat-binh-thuong-transparent.png" id="layer-open" class="sprite-layer" alt="Normal">
        <img src="assets/cat-chuan-bi-chay-transparent.png" id="layer-run1" class="sprite-layer" alt="Run 1">
        <img src="assets/cat-chay-di-transparent.png" id="layer-run2" class="sprite-layer" alt="Run 2">
        <img src="assets/cat-vui-ve-transparent.png" id="layer-cheer" class="sprite-layer" alt="Cheer">
        <img src="assets/cat-chi-tay-logo-transparent.png" id="layer-point" class="sprite-layer" alt="Point">
        <img src="assets/cat-nghieng-dau-transparent.png" id="layer-tilt" class="sprite-layer" alt="Look up">
        <img src="assets/cat-quay-lai-transparent.png" id="layer-wave" class="sprite-layer" alt="Wave">
      </div>
    </div>

    <!-- KHUNG ĐĂNG NHẬP THIẾT KẾ HIỆN ĐẠI -->
    <div class="card" id="login-card">
      <div class="card-header">
        <div class="brand-badge">
          <img src="assets/logo.png" alt="SIU">
          <span>Saigon International University</span>
        </div>
        <h1>Điểm Danh Lớp Học</h1>
        <p>Nhập mã học phần để vào danh sách</p>
      </div>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="input-group">
          <label for="class-code">
            <span>Mã lớp học phần</span>
            <span class="badge-req">Bắt buộc</span>
          </label>
          <div class="input-wrapper">
            <input type="text" id="class-code" placeholder="VD: 241_71ITEC20203_01" required autocomplete="off">
          </div>
        </div>

        <div class="input-group">
          <label for="pin-code">
            <span>Mã PIN (6 số)</span>
            <span class="badge-req">Bắt buộc</span>
          </label>
          <div class="input-wrapper">
            <input type="password" id="pin-code" maxlength="6" pattern="[0-9]{6}" inputmode="numeric" placeholder="••••••" required>
          </div>
        </div>

        <div class="remember-row">
          <label class="remember-label">
            <input type="checkbox" id="remember-me">
            <span>Ghi nhớ mã lớp trên máy này</span>
          </label>
        </div>

        <button type="submit" class="btn-submit" id="btn-login">
          <span>Vào lớp</span>
        </button>

        <div class="loading-notice" id="loading-notice">
          🐾 Đang tìm lớp, vui lòng chờ trong giây lát...
        </div>

        <div class="error-msg" id="error-msg"></div>
      </form>
    </div>
  </div>

  <!-- ==================== MÀN CHUYỂN CẢNH CYBER ==================== -->
  <div id="cyber-screen">
    <div class="cyber-portal">
      <div class="cyber-ring r1"></div>
      <div class="cyber-ring r2"></div>
      <button class="cyber-core-btn" id="cyber-core-btn" onclick="triggerCyberLaunch()">
        <img src="assets/logo.png" alt="Portal Button">
      </button>

      <div class="cyber-guide">
        <div class="cyber-bubble">Nhấn vào nè!</div>
        <img src="assets/cat-chi-tay-logo-transparent.png" class="cyber-cat-pointer" alt="Point Mascot">
      </div>
    </div>
  </div>

  <!-- ==================== MÀN ĐIỂM DANH HOÀN CHỈNH ==================== -->
  <div id="attendance-screen">
    <div class="dash-header">
      <div>
        <div class="dash-title" id="dash-class-name">Lớp: 241_71ITEC20203_01</div>
        <div class="dash-sub">Sĩ số: <span id="dash-total">8</span> sinh viên</div>
      </div>
      <button class="btn-secondary" onclick="logout()">Đổi lớp</button>
    </div>

    <!-- Hàng lọc -->
    <div class="filter-grid">
      <select id="select-session">
        <option>Buổi 1</option>
        <option>Buổi 2</option>
        <option>Buổi 3</option>
        <option selected>Buổi 4</option>
        <option>Buổi 5</option>
      </select>
      <select id="select-status">
        <option value="normal">Có học</option>
        <option value="off">Giảng viên nghỉ</option>
      </select>
      <input type="date" id="select-date">
    </div>

    <!-- 3 Ô thống kê -->
    <div class="stats-row">
      <div class="stat-badge present">
        <div class="stat-num" id="stat-present">8</div>
        <div class="stat-text">Có mặt</div>
      </div>
      <div class="stat-badge absent-kp">
        <div class="stat-num" id="stat-kp">0</div>
        <div class="stat-text">Không phép</div>
      </div>
      <div class="stat-badge absent-cp">
        <div class="stat-num" id="stat-cp">0</div>
        <div class="stat-text">Có phép</div>
      </div>
    </div>

    <!-- Ô tìm kiếm sinh viên -->
    <input type="text" class="search-box" id="search-student" placeholder="🔍 Tìm theo MSSV hoặc họ tên..." oninput="filterStudents()">

    <!-- Danh sách điểm danh sinh viên -->
    <div class="student-list" id="student-list-container">
      <!-- Render sinh viên động -->
    </div>

    <!-- Thanh thao tác dưới -->
    <div class="bottom-bar">
      <button class="btn-secondary" onclick="resetAllAbsent()">Bỏ chọn tất cả</button>
      <button class="btn-secondary" onclick="reportWrongList()">Báo sai danh sách</button>
      <button class="btn-primary-action" onclick="submitAttendance()">Gửi điểm danh</button>
    </div>
  </div>

  <script>
    /* ==========================================================================
       1. CẤU HÌNH API BACKEND CHO GOOGLE APPS SCRIPT
       ========================================================================== */
    const isGAS = typeof google !== 'undefined' && google.script && google.script.run;

    function callGAS(funcName, ...args) {
      return new Promise((resolve, reject) => {
        if (!isGAS) {
          // Mock data khi chạy trực tiếp ngoài trình duyệt
          setTimeout(() => {
            if (funcName === 'apiLogin') {
              const [cls, pin] = args;
              if (pin === '000000') {
                reject(new Error('Mã PIN không chính xác (mẫu test lỗi)!'));
              } else {
                resolve({
                  ok: true,
                  cls: cls || '241_71ITEC20203_01',
                  students: [
                    { mssv: '21010001', name: 'Nguyễn Văn An' },
                    { mssv: '21010002', name: 'Trần Thị Bích' },
                    { mssv: '21010003', name: 'Lê Hoàng Cường' },
                    { mssv: '21010004', name: 'Phạm Đức Duy' },
                    { mssv: '21010005', name: 'Vũ Ngọc Hân' },
                    { mssv: '21010006', name: 'Đặng Minh Khôi' },
                    { mssv: '21010007', name: 'Bùi Gia Linh' },
                    { mssv: '21010008', name: 'Hoàng Nhật Nam' }
                  ]
                });
              }
            } else {
              resolve({ ok: true });
            }
          }, 1100);
          return;
        }

        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)[funcName](...args);
      });
    }

    /* ==========================================================================
       2. HỆ THỐNG ANIMATION MÈO CHUẨN XÁC 60FPS (SPRING & LERP PHYSICS)
       ========================================================================== */
    const mascotStage = document.getElementById('mascot-stage');
    const mascotInner = document.getElementById('mascot-inner');
    const eyeContainer = document.getElementById('eye-container');
    const irisLeft = document.getElementById('iris-left');
    const irisRight = document.getElementById('iris-right');

    const layers = {
      noeyes: document.getElementById('layer-noeyes'),
      closed: document.getElementById('layer-closed'),
      open: document.getElementById('layer-open'),
      run1: document.getElementById('layer-run1'),
      run2: document.getElementById('layer-run2'),
      cheer: document.getElementById('layer-cheer'),
      point: document.getElementById('layer-point'),
      tilt: document.getElementById('layer-tilt'),
      wave: document.getElementById('layer-wave')
    };

    // Vị trí mục tiêu và hiện tại cho LERP
    let targetEyeX = 0, targetEyeY = 0;
    let currentEyeX = 0, currentEyeY = 0;
    let targetHeadTilt = 0, currentHeadTilt = 0;

    // Giới hạn an toàn di chuyển tròng mắt trong hốc tròn (±6px ở stage 250px)
    const MAX_OFFSET_X = 6.5;
    const MAX_OFFSET_Y = 5.0;
    const LERP_FACTOR = 0.15;

    let isTyping = false;
    let isRunning = false;
    let currentActiveLayer = 'noeyes';

    // Đổi tư thế có cross-fade mượt mà bằng opacity
    function setPose(layerKey) {
      if (currentActiveLayer === layerKey) return;
      
      if (layerKey === 'noeyes') {
        eyeContainer.style.opacity = '1';
      } else {
        eyeContainer.style.opacity = '0';
      }

      Object.keys(layers).forEach(k => {
        if (layers[k]) layers[k].classList.remove('active');
      });

      if (layers[layerKey]) {
        layers[layerKey].classList.add('active');
        currentActiveLayer = layerKey;
      }
    }

    // VÒNG LẶP NỘI SUY 60FPS
    function renderMascotFrame() {
      currentEyeX += (targetEyeX - currentEyeX) * LERP_FACTOR;
      currentEyeY += (targetEyeY - currentEyeY) * LERP_FACTOR;
      currentHeadTilt += (targetHeadTilt - currentHeadTilt) * 0.08;

      const eyeTransform = `translate3d(${currentEyeX.toFixed(2)}px, ${currentEyeY.toFixed(2)}px, 0)`;
      irisLeft.style.transform = eyeTransform;
      irisRight.style.transform = eyeTransform;

      mascotInner.style.transform = `rotate(${currentHeadTilt.toFixed(2)}deg)`;

      requestAnimationFrame(renderMascotFrame);
    }
    requestAnimationFrame(renderMascotFrame);

    // BÁM THEO CHUỘT KHI KHÔNG GÕ PHÍM
    window.addEventListener('mousemove', (e) => {
      if (isTyping || isRunning) return;

      const rect = mascotStage.getBoundingClientRect();
      const mascotCenterX = rect.left + rect.width / 2;
      const mascotCenterY = rect.top + rect.height * 0.42;

      const dx = e.clientX - mascotCenterX;
      const dy = e.clientY - mascotCenterY;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist > 0) {
        const factor = Math.min(dist / 320, 1);
        targetEyeX = (dx / dist) * MAX_OFFSET_X * factor;
        targetEyeY = (dy / dist) * MAX_OFFSET_Y * factor;
        targetHeadTilt = Math.max(-3, Math.min(3, (dx / 320) * 3));
      }
    });

    // CHỚP MẮT TỰ NHIÊN (3 - 5 GIÂY)
    function scheduleBlink() {
      const interval = Math.random() * 2000 + 3000;
      setTimeout(() => {
        if (!isRunning && currentActiveLayer === 'noeyes') {
          layers.closed.classList.add('active');
          eyeContainer.style.opacity = '0';

          setTimeout(() => {
            layers.closed.classList.remove('active');
            eyeContainer.style.opacity = '1';
            scheduleBlink();
          }, 130);
        } else {
          scheduleBlink();
        }
      }, interval);
    }
    scheduleBlink();

    // MẮT BÁM THEO VỊ TRÍ CON TRỎ GÕ PHÍM (CARET)
    function trackInputCaret(input) {
      if (isRunning) return;
      isTyping = true;

      const rect = input.getBoundingClientRect();
      const mascotRect = mascotStage.getBoundingClientRect();
      const mascotCenterX = mascotRect.left + mascotRect.width / 2;
      const mascotCenterY = mascotRect.top + mascotRect.height * 0.42;

      const charWidth = 9.5;
      const caretX = rect.left + Math.min(input.selectionStart * charWidth, rect.width - 24) + 16;
      const caretY = rect.top + rect.height / 2;

      const dx = caretX - mascotCenterX;
      const dy = caretY - mascotCenterY;
      const dist = Math.sqrt(dx * dx + dy * dy);

      targetEyeX = Math.max(-MAX_OFFSET_X, Math.min(MAX_OFFSET_X, (dx / dist) * MAX_OFFSET_X));
      targetEyeY = Math.max(-MAX_OFFSET_Y, Math.min(MAX_OFFSET_Y, (dy / dist) * MAX_OFFSET_Y));
      targetHeadTilt = (dx / 400) * 2.5;

      clearTimeout(input._typingTimer);
      input._typingTimer = setTimeout(() => {
        isTyping = false;
      }, 1200);
    }

    const classInput = document.getElementById('class-code');
    const pinInput = document.getElementById('pin-code');

    [classInput, pinInput].forEach(inp => {
      inp.addEventListener('input', () => trackInputCaret(inp));
      inp.addEventListener('focus', () => trackInputCaret(inp));
      inp.addEventListener('blur', () => {
        setTimeout(() => { isTyping = false; }, 200);
      });
    });

    // GHI NHỚ MÃ LỚP
    const savedClass = localStorage.getItem('siu_class_code');
    if (savedClass) {
      classInput.value = savedClass;
      document.getElementById('remember-me').checked = true;
    }

    /* ==========================================================================
       3. XỬ LÝ ĐĂNG NHẬP, LOADING BƯỚC CHẠY VÀ CYBER LAUNCH
       ========================================================================== */
    let runInterval = null;

    async function handleLogin(e) {
      e.preventDefault();
      const cls = classInput.value.trim();
      const pin = pinInput.value.trim();
      const remember = document.getElementById('remember-me').checked;

      if (remember) {
        localStorage.setItem('siu_class_code', cls);
      } else {
        localStorage.removeItem('siu_class_code');
      }

      const btn = document.getElementById('btn-login');
      const notice = document.getElementById('loading-notice');
      const errBox = document.getElementById('error-msg');
      errBox.style.display = 'none';
      btn.disabled = true;
      notice.style.display = 'block';

      // Mèo chạy luân phiên 2 bước chân
      isRunning = true;
      let step = 0;
      setPose('run1');
      runInterval = setInterval(() => {
        step = 1 - step;
        setPose(step === 0 ? 'run1' : 'run2');
      }, 180);

      try {
        const res = await callGAS('apiLogin', cls, pin);
        clearInterval(runInterval);
        isRunning = false;

        // Thành công: Squash & Stretch nảy nhẹ và đổi sang vui vẻ
        mascotStage.classList.add('mascot-squash');
        setPose('cheer');
        setTimeout(() => mascotStage.classList.remove('mascot-squash'), 220);

        setTimeout(() => {
          document.getElementById('login-container').style.display = 'none';
          const cyberScreen = document.getElementById('cyber-screen');
          cyberScreen.classList.add('active');
          window.sessionData = res;
        }, 550);

      } catch (err) {
        clearInterval(runInterval);
        isRunning = false;
        btn.disabled = false;
        notice.style.display = 'none';

        // Lỗi: Nghiêng đầu bối rối và rung card
        setPose('tilt');
        const card = document.getElementById('login-card');
        card.classList.add('shake');
        errBox.textContent = err.message || 'Mã lớp hoặc PIN không đúng!';
        errBox.style.display = 'block';

        setTimeout(() => {
          card.classList.remove('shake');
          setPose('noeyes');
        }, 1200);
      }
    }

    // CHUYỂN CẢNH CYBER
    function triggerCyberLaunch() {
      const btn = document.getElementById('cyber-core-btn');
      
      const shock = document.createElement('div');
      shock.className = 'shockwave';
      btn.parentElement.appendChild(shock);

      btn.style.transform = 'scale(0.88)';
      
      setTimeout(() => {
        btn.style.transform = 'scale(1.1)';
        const cyberScreen = document.getElementById('cyber-screen');
        cyberScreen.style.opacity = '0';

        setTimeout(() => {
          cyberScreen.classList.remove('active');
          initAttendanceDashboard(window.sessionData);
        }, 400);
      }, 250);
    }

    /* ==========================================================================
       4. TRANG ĐIỂM DANH SINH VIÊN
       ========================================================================== */
    let studentData = [];
    let attendanceMap = {};

    function initAttendanceDashboard(data) {
      const screen = document.getElementById('attendance-screen');
      screen.classList.add('active');

      document.getElementById('select-date').valueAsDate = new Date();
      document.getElementById('dash-class-name').textContent = `Lớp: ${data.cls}`;
      
      studentData = data.students || [];
      document.getElementById('dash-total').textContent = studentData.length;
      
      renderStudentList(studentData);
      updateStats();
    }

    function renderStudentList(list) {
      const container = document.getElementById('student-list-container');
      container.innerHTML = '';

      list.forEach(stu => {
        const item = document.createElement('div');
        item.className = 'student-item';
        const currentStatus = attendanceMap[stu.mssv] || '';

        item.innerHTML = `
          <div class="student-info">
            <span class="stu-name">${stu.name}</span>
            <span class="stu-id">${stu.mssv}</span>
          </div>
          <div class="attendance-actions">
            <button class="btn-att kp ${currentStatus === 'KP' ? 'active' : ''}" onclick="toggleStatus('${stu.mssv}', 'KP')">Không phép</button>
            <button class="btn-att cp ${currentStatus === 'CP' ? 'active' : ''}" onclick="toggleStatus('${stu.mssv}', 'CP')">Có phép</button>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function toggleStatus(mssv, type) {
      if (attendanceMap[mssv] === type) {
        delete attendanceMap[mssv];
      } else {
        attendanceMap[mssv] = type;
      }
      filterStudents();
      updateStats();
    }

    function updateStats() {
      let kp = 0;
      let cp = 0;
      Object.values(attendanceMap).forEach(v => {
        if (v === 'KP') kp++;
        if (v === 'CP') cp++;
      });

      const total = studentData.length;
      const present = total - (kp + cp);

      document.getElementById('stat-present').textContent = present;
      document.getElementById('stat-kp').textContent = kp;
      document.getElementById('stat-cp').textContent = cp;
    }

    function filterStudents() {
      const q = document.getElementById('search-student').value.toLowerCase().trim();
      const filtered = studentData.filter(s => 
        s.name.toLowerCase().includes(q) || s.mssv.includes(q)
      );
      renderStudentList(filtered);
    }

    function resetAllAbsent() {
      attendanceMap = {};
      filterStudents();
      updateStats();
    }

    function reportWrongList() {
      const note = prompt('Nhập phản ánh hoặc lỗi danh sách lớp:');
      if (note) {
        callGAS('apiReportWrong', classInput.value, note).then(() => {
          alert('Đã gửi báo cáo đến giảng viên / quản lý hệ thống!');
        });
      }
    }

    async function submitAttendance() {
      const absentList = Object.keys(attendanceMap).map(mssv => ({
        mssv: mssv,
        type: attendanceMap[mssv]
      }));

      const payload = {
        classCode: classInput.value,
        session: document.getElementById('select-session').value,
        status: document.getElementById('select-status').value,
        date: document.getElementById('select-date').value,
        absent: absentList
      };

      try {
        await callGAS('apiSubmit', payload);
        alert('🎉 Đã lưu kết quả điểm danh thành công!');
      } catch (err) {
        alert('Lỗi lưu điểm danh: ' + err.message);
      }
    }

    function logout() {
      document.getElementById('attendance-screen').classList.remove('active');
      document.getElementById('login-container').style.display = 'block';
      document.getElementById('btn-login').disabled = false;
      document.getElementById('loading-notice').style.display = 'none';
      setPose('noeyes');
    }
  </script>
</body>
