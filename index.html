<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SIU VIP - Hệ Thống Điểm Danh & Khởi Động Điện Ảnh</title>
  <style>
    :root {
      --bg-black: #030712;
      --cyan: #00f3ff;
      --cyan-glow: rgba(0, 243, 255, 0.65);
      --cyan-dim: rgba(0, 243, 255, 0.2);
      --gold: #fbbf24;
      --red-flag: #da251d;
      --primary: #1e3a8a;
      --primary-accent: #2563eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-black);
      color: #ffffff;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* ========================================================
       PHẦN 1: MÀN HÌNH INTRO SCI-FI BOOT (NỀN ĐEN TUYỀN)
       ======================================================== */
    #intro-screen {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #000000;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      opacity: 1;
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #intro-screen.finished {
      opacity: 0;
      pointer-events: none;
    }

    /* Lưới vi mạch nền mờ nhẹ */
    .intro-grid {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: 
        radial-gradient(circle at center, rgba(0, 243, 255, 0.08) 0%, transparent 70%),
        linear-gradient(rgba(0, 243, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 243, 255, 0.04) 1px, transparent 1px);
      background-size: 100% 100%, 48px 48px, 48px 48px;
      pointer-events: none;
    }

    /* Canvas vẽ tia lửa điện bùng nổ */
    #sparks-canvas {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 25;
    }

    /* 4 GÓC MÀN HÌNH - PADDING TƯƠNG ĐỐI CLAMP() */
    .hud-corner {
      position: absolute;
      z-index: 30;
      opacity: 0;
      transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .hud-corner.active {
      opacity: 1;
      transform: none !important;
    }

    /* GÓC TRÁI TRÊN: LOGO SIU + VÒNG QUAY NĂNG LƯỢNG */
    .corner-tl {
      top: max(16px, 3.5vmin);
      left: max(16px, 3.5vmin);
      transform: translate(-10px, -10px);
    }

    .siu-logo-orbit {
      position: relative;
      width: clamp(70px, 12vmin, 96px);
      height: clamp(70px, 12vmin, 96px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .siu-logo-orbit svg {
      position: absolute;
      width: 100%; height: 100%;
      overflow: visible;
    }

    /* Vòng tròn vẽ nét kiểu Oppo (0.5s - 2.5s) */
    .circle-draw {
      stroke: var(--cyan);
      stroke-width: 2.5;
      fill: none;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      transform-origin: center;
      filter: drop-shadow(0 0 6px var(--cyan));
      animation: drawCircle 2s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
    }

    @keyframes drawCircle {
      to { stroke-dashoffset: 0; }
    }

    /* Vành tia lửa quay vĩnh cửu (từ 2.5s) */
    .spark-ring {
      stroke: var(--cyan);
      stroke-width: 1.5;
      stroke-dasharray: 6 14;
      fill: none;
      opacity: 0;
      transform-origin: center;
      animation: spinRing 8s linear infinite;
    }

    .spark-ring.spinning {
      opacity: 0.8;
      transition: opacity 0.4s ease;
    }

    @keyframes spinRing {
      to { transform: rotate(360deg); }
    }

    .logo-img {
      width: 62%;
      height: 62%;
      object-fit: contain;
      border-radius: 50%;
      opacity: 0;
      transform: scale(0.85);
      animation: fadeInLogo 1.6s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards;
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.4));
    }

    @keyframes fadeInLogo {
      to { opacity: 1; transform: scale(1); }
    }

    /* GÓC PHẢI TRÊN: CỜ VIỆT NAM CHUẨN TỈ LỆ VÀNG */
    .corner-tr {
      top: max(16px, 3.5vmin);
      right: max(16px, 3.5vmin);
      transform: translate(10px, -10px);
    }

    .flag-vn {
      width: clamp(56px, 9vmin, 80px);
      height: clamp(38px, 6vmin, 54px);
      background: var(--red-flag);
      border-radius: 4px;
      box-shadow: 0 0 20px rgba(218, 37, 29, 0.5), 0 0 5px rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .flag-vn svg {
      width: 44%;
      height: 44%;
      fill: #ffff00;
      filter: drop-shadow(0 0 6px #ffea00);
    }

    /* GÓC TRÁI DƯỚI: BIỂU TƯỢNG QUỐC TẾ GLOBE SCI-FI */
    .corner-bl {
      bottom: max(16px, 3.5vmin);
      left: max(16px, 3.5vmin);
      display: flex;
      align-items: center;
      gap: 10px;
      transform: translate(-10px, 10px);
    }

    .globe-icon {
      width: clamp(36px, 6vmin, 48px);
      height: clamp(36px, 6vmin, 48px);
      border-radius: 50%;
      border: 1.5px solid var(--cyan);
      box-shadow: 0 0 15px var(--cyan-dim);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: spinGlobe 14s linear infinite;
    }

    @keyframes spinGlobe {
      to { transform: rotate(360deg); }
    }

    .globe-icon::before {
      content: "";
      position: absolute;
      width: 45%; height: 100%;
      border-radius: 50%;
      border: 1px dashed var(--cyan);
    }

    .globe-icon::after {
      content: "";
      position: absolute;
      width: 100%; height: 45%;
      border-radius: 50%;
      border: 1px dashed var(--cyan);
    }

    .global-text {
      font-size: clamp(10px, 1.8vmin, 12px);
      letter-spacing: 2px;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: 700;
    }

    /* GÓC PHẢI DƯỚI: CHỮ "ASEAN NATIONAL CEO" */
    .corner-br {
      bottom: max(16px, 3.5vmin);
      right: max(16px, 3.5vmin);
      text-align: right;
      transform: translate(10px, 10px);
    }

    .asean-title {
      font-size: clamp(18px, 3.2vmin, 26px);
      font-weight: 900;
      letter-spacing: 5px;
      background: linear-gradient(135deg, #ffffff 0%, var(--cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
    }

    .asean-sub {
      font-size: clamp(9px, 1.5vmin, 11px);
      letter-spacing: 3.5px;
      color: #64748b;
      margin-top: 2px;
      font-weight: 700;
    }

    /* ========================================================
       CHÍNH GIỮA: CHIP TRUNG TÂM + 3 TAM GIÁC ROBOT
       ======================================================== */
    .center-stage {
      position: relative;
      width: min(85vw, 420px);
      height: min(85vw, 420px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }

    /* SVG 4 đường dây chính lan ra 4 góc màn hình */
    #wires-svg {
      position: absolute;
      top: -100vh; left: -100vw;
      width: 300vw; height: 300vh;
      pointer-events: none;
      z-index: 10;
    }

    .conduit-wire {
      stroke: var(--cyan);
      stroke-width: 2;
      fill: none;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      filter: drop-shadow(0 0 5px var(--cyan));
      transition: stroke-dashoffset 1.7s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .conduit-wire.active {
      stroke-dashoffset: 0;
    }

    /* Chip trung tâm hình vuông bo góc vi mạch */
    .core-chip {
      width: clamp(86px, 16vmin, 120px);
      height: clamp(86px, 16vmin, 120px);
      background: radial-gradient(circle at center, #0f172a 0%, #030712 100%);
      border: 2px solid var(--cyan);
      border-radius: 24px;
      box-shadow: 0 0 35px var(--cyan-dim), inset 0 0 20px rgba(0, 243, 255, 0.25);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.25s ease;
      cursor: pointer;
    }

    .core-chip.pressed {
      transform: scale(0.90);
      box-shadow: 0 0 65px var(--cyan), inset 0 0 35px var(--cyan);
    }

    .chip-inner-logo {
      width: 60%;
      height: 60%;
      object-fit: contain;
      filter: drop-shadow(0 0 8px rgba(0, 243, 255, 0.6));
    }

    /* 3 Tam giác robot mecha */
    .tri-armor {
      position: absolute;
      width: clamp(34px, 6.5vmin, 44px);
      height: clamp(34px, 6.5vmin, 44px);
      z-index: 18;
      transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.2s ease;
      cursor: pointer;
    }

    .tri-armor svg {
      width: 100%; height: 100%;
      overflow: visible;
    }

    .tri-armor polygon {
      fill: #0c1527;
      stroke: var(--cyan);
      stroke-width: 2.5;
      filter: drop-shadow(0 0 4px var(--cyan-dim));
      transition: all 0.2s ease;
    }

    .tri-armor.lit polygon {
      fill: #00f3ff;
      filter: drop-shadow(0 0 16px #00f3ff);
    }

    .tri-armor.pressed {
      transform: scale(0.82) !important;
    }

    /* Vị trí 3 tam giác quanh chip */
    .tri-top {
      top: 15%;
      left: 50%;
      transform: translateX(-50%);
    }

    .tri-bl {
      bottom: 20%;
      left: 20%;
      transform: rotate(-120deg);
    }

    .tri-br {
      bottom: 20%;
      right: 20%;
      transform: rotate(120deg);
    }

    /* ========================================================
       CHỮ "VIỆT NAM" LOANG VẾT SƠN NĂNG LƯỢNG (4.6)
       ======================================================== */
    .vn-title-wrapper {
      position: absolute;
      bottom: max(55px, 9vmin);
      left: 50%;
      transform: translateX(-50%);
      width: max-content;
      text-align: center;
      z-index: 25;
      pointer-events: none;
    }

    .vn-text {
      font-size: clamp(24px, 5vmin, 42px);
      font-weight: 900;
      letter-spacing: clamp(6px, 1.5vmin, 14px);
      text-transform: uppercase;
      user-select: none;
      white-space: nowrap;
    }

    /* Lớp chữ mờ chìm dưới nền đen ban đầu */
    .vn-dim {
      color: #1e293b;
      opacity: 0.6;
    }

    /* Lớp chữ màu rực rỡ loang dần bằng clip-path */
    .vn-colored {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(135deg, #ef4444 0%, #f59e0b 50%, #facc15 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 25px rgba(245, 158, 11, 0.7));
      clip-path: circle(0% at 50% 0%);
      transition: clip-path 1.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .vn-colored.spread {
      clip-path: circle(150% at 50% 0%);
    }

    /* NÚT VÀO TRANG CHÍNH & BỎ QUA */
    .btn-enter-main {
      position: absolute;
      bottom: max(16px, 3vmin);
      left: 50%;
      transform: translateX(-50%);
      height: 44px;
      padding: 0 28px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--cyan) 0%, #2563eb 100%);
      color: #000000;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1px;
      border: none;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.6);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 50;
      white-space: nowrap;
    }

    .btn-enter-main.active {
      opacity: 1;
      pointer-events: auto;
    }

    .btn-enter-main:hover {
      transform: translateX(-50%) scale(1.06);
      box-shadow: 0 0 35px var(--cyan);
    }

    .btn-skip {
      position: absolute;
      bottom: max(12px, 2.5vmin);
      right: max(16px, 3vmin);
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #94a3b8;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 11.5px;
      cursor: pointer;
      z-index: 60;
      opacity: 0;
      transition: all 0.3s;
    }

    .btn-skip.active {
      opacity: 0.7;
    }

    .btn-skip:hover {
      opacity: 1;
      border-color: var(--cyan);
      color: #fff;
    }

    /* ========================================================
       PHẦN 2: WEB APP CHÍNH (MASCOT 60FPS + ĐIỂM DANH)
       ======================================================== */
    #main-app {
      display: none;
      opacity: 0;
      min-height: 100vh;
      width: 100%;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      position: relative;
      background: radial-gradient(circle at 50% 15%, #1e1b4b 0%, #0c1222 55%, var(--bg-black) 100%);
      transition: opacity 0.5s ease;
    }

    #main-app.active {
      display: flex;
      opacity: 1;
    }

    .container {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 10;
    }

    .mascot-stage {
      position: relative;
      width: 250px;
      height: 250px;
      margin: 0 auto -28px auto;
      z-index: 20;
      pointer-events: none;
      will-change: transform;
      animation: catBreath 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      transform-origin: bottom center;
    }

    @keyframes catBreath {
      0%, 100% { transform: translateY(0px) scale(1, 1); }
      50% { transform: translateY(-4px) scale(1.012, 0.992); }
    }

    .mascot-squash {
      transform: scale(1.04, 0.95) translateY(3px) !important;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .mascot-inner {
      position: relative;
      width: 100%;
      height: 100%;
      will-change: transform;
      transform-origin: 50% 75%;
    }

    .sprite-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.18s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: opacity;
    }

    .sprite-layer.active { opacity: 1; }

    .eye-layer-container {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 5;
      transition: opacity 0.15s ease;
    }

    .eye-socket {
      position: absolute;
      width: 10.15%; height: 10.15%;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .eye-socket.left { left: 35.15%; top: 38.08%; }
    .eye-socket.right { left: 54.68%; top: 38.08%; }

    .iris-pupil {
      position: absolute;
      width: 80%; height: 80%;
      object-fit: contain;
      will-change: transform;
      transform: translate3d(0, 0, 0);
      filter: drop-shadow(0 0 2px rgba(30, 58, 138, 0.45));
      border-radius: 50%;
    }

    /* CARD GLASSMORPHISM */
    .card {
      background: rgba(255, 255, 255, 0.96);
      border-radius: 32px;
      box-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.5), 0 0 40px rgba(37, 99, 235, 0.2);
      padding: 40px 32px 32px 32px;
      backdrop-filter: blur(20px);
      border: 1.5px solid rgba(255, 255, 255, 0.8);
      color: #0f172a;
    }

    .card-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 26px;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(37, 99, 235, 0.08);
      border: 1px solid rgba(37, 99, 235, 0.18);
      padding: 6px 16px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    .brand-badge img { width: 22px; height: 22px; object-fit: contain; }
    .brand-badge span {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--primary-accent);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .card-header h1 {
      font-size: 23px;
      font-weight: 800;
      letter-spacing: -0.6px;
    }

    .card-header p {
      font-size: 13.5px;
      color: #64748b;
      margin-top: 4px;
    }

    .input-group { margin-bottom: 18px; }
    .input-group label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 7px;
    }

    .input-wrapper input {
      width: 100%;
      height: 52px;
      padding: 0 18px;
      border-radius: 16px;
      border: 1.5px solid #e2e8f0;
      background: #f8fafc;
      font-size: 15px;
      font-weight: 600;
      color: #0f172a;
      outline: none;
      transition: all 0.2s;
    }

    .input-wrapper input:focus {
      border-color: var(--primary-accent);
      background: #ffffff;
      box-shadow: 0 0 0 4.5px rgba(37, 99, 235, 0.14);
    }

    .remember-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      font-size: 13.5px;
      color: #475569;
    }

    .remember-label {
      display: flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
    }

    .btn-submit {
      width: 100%;
      height: 54px;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: white;
      border: none;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 24px -4px rgba(37, 99, 235, 0.45);
      transition: all 0.2s;
    }

    .loading-notice {
      display: none;
      margin-top: 18px;
      text-align: center;
      font-size: 13.5px;
      color: var(--primary-accent);
      font-weight: 700;
      animation: pulseNotice 1.4s ease-in-out infinite;
    }

    @keyframes pulseNotice {
      0%, 100% { opacity: 0.6; } 50% { opacity: 1; }
    }

    .error-msg {
      display: none;
      margin-top: 14px;
      padding: 12px 16px;
      background: #fef2f2;
      border: 1px solid #fee2e2;
      border-radius: 14px;
      color: #dc2626;
      font-size: 13px;
      text-align: center;
      font-weight: 600;
    }

    .shake {
      animation: shakeCard 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    @keyframes shakeCard {
      10%, 90% { transform: translate3d(-3px, 0, 0); }
      20%, 80% { transform: translate3d(5px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-7px, 0, 0); }
      40%, 60% { transform: translate3d(7px, 0, 0); }
    }

    /* MÀN ĐIỂM DANH */
    #attendance-screen {
      display: none;
      width: 100%;
      max-width: 620px;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 32px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
      padding: 28px 26px;
      color: #0f172a;
      z-index: 10;
    }

    #attendance-screen.active {
      display: block;
      animation: screenIn 0.35s ease-out forwards;
    }

    @keyframes screenIn {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }

    .dash-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1.5px solid #f1f5f9;
      padding-bottom: 16px;
      margin-bottom: 18px;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .filter-grid select, .filter-grid input {
      width: 100%;
      height: 42px;
      padding: 0 10px;
      border-radius: 12px;
      border: 1.5px solid #cbd5e1;
      font-size: 13.5px;
      font-weight: 600;
      background: #f8fafc;
      outline: none;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .stat-badge {
      background: #f8fafc;
      border-radius: 16px;
      padding: 12px 10px;
      text-align: center;
      border: 1.5px solid #e2e8f0;
    }

    .stat-badge.present { border-color: rgba(16, 185, 129, 0.35); background: #ecfdf5; color: #065f46; }
    .stat-badge.absent-kp { border-color: rgba(239, 68, 68, 0.35); background: #fef2f2; color: #991b1b; }

  <!-- ==================== JAVASCRIPT ĐIỀU KHIỂN ĐỒNG BỘ 60FPS ==================== -->
  <script>
    /* ========================================================
       PHẦN 1: SEQUENCE ANIMATION INTRO SCI-FI (THEO ĐÚNG ĐẶC TẢ)
       ======================================================== */
    const canvas = document.getElementById('sparks-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Hạt tia lửa điện hạt Plasma bùng nổ khi ấn chip
    class Spark {
      constructor(x, y, angle, speed, color) {
        this.x = x;
        this.y = y;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.color = color;
        this.alpha = 1;
        this.decay = Math.random() * 0.03 + 0.02;
        this.length = Math.random() * 14 + 8;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= this.decay;
      }
      draw(ctx) {
        if (this.alpha <= 0) return;
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 2;
        ctx.shadowBlur = 8;
        ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.x - this.vx * (this.length / 5), this.y - this.vy * (this.length / 5));
        ctx.stroke();
        ctx.restore();
      }
    }

    function spawnPlasmaShockwave(cx, cy) {
      for (let i = 0; i < 36; i++) {
        const angle = (Math.PI * 2 / 36) * i + (Math.random() - 0.5) * 0.2;
        const speed = Math.random() * 7 + 4;
        const color = Math.random() > 0.3 ? '#00f3ff' : '#ffffff';
        particles.push(new Spark(cx, cy, angle, speed, color));
      }
    }

    function renderSparksLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw(ctx);
        if (particles[i].alpha <= 0) particles.splice(i, 1);
      }
      requestAnimationFrame(renderSparksLoop);
    }
    requestAnimationFrame(renderSparksLoop);

    // QUẢN LÝ DÒNG THỜI GIAN TIMELINE
    const introTimers = [];
    function schedule(fn, delay) {
      const t = setTimeout(fn, delay);
      introTimers.push(t);
      return t;
    }

    const cornerTL = document.getElementById('corner-tl');
    const cornerTR = document.getElementById('corner-tr');
    const cornerBL = document.getElementById('corner-bl');
    const cornerBR = document.getElementById('corner-br');
    const sparkRing = document.getElementById('spark-ring');
    const triTop = document.getElementById('tri-top');
    const triBL = document.getElementById('tri-bl');
    const triBR = document.getElementById('tri-br');
    const coreChip = document.getElementById('core-chip');
    const vnColored = document.getElementById('vn-colored');
    const btnEnter = document.getElementById('btn-enter-main');
    const btnSkip = document.getElementById('btn-skip');

    // Khởi chạy trình tự
    function runIntroTimeline() {
      // 1.0s: Nút bỏ qua hiện nhẹ
      schedule(() => btnSkip.classList.add('active'), 1000);

      // 4.1: Logo SIU (0.5s - 2.5s)
      schedule(() => cornerTL.classList.add('active'), 500);

      // 4.2: Tia lửa điện xoay liên tục (2.5s)
      schedule(() => sparkRing.classList.add('spinning'), 2500);

      // 4.3: Ba tam giác robot ấn vào lần lượt (3.0s - 4.2s)
      schedule(() => pulseTri(triTop), 3000);
      schedule(() => pulseTri(triBL), 3400);
      schedule(() => pulseTri(triBR), 3800);

      // 4.4: Chip ấn vào & nổ tia lửa (4.2s - 4.8s)
      schedule(() => pulseChip(), 4200);

      // 4.5: Dây chính lan tới 4 góc (4.8s - 6.5s)
      schedule(() => {
        document.getElementById('wire-tl').classList.add('active');
        document.getElementById('wire-tr').classList.add('active');
        document.getElementById('wire-bl').classList.add('active');
        document.getElementById('wire-br').classList.add('active');
      }, 4800);

      // 4.6: Chữ VIỆT NAM loang vết sơn năng lượng (6.5s - 8.3s)
      schedule(() => vnColored.classList.add('spread'), 6500);

      // 4.7: Hoàn thiện các góc & Nút Vào trang chính (7.5s - 9.0s)
      schedule(() => cornerTR.classList.add('active'), 7500);
      schedule(() => cornerBL.classList.add('active'), 7800);
      schedule(() => cornerBR.classList.add('active'), 8100);
      schedule(() => btnEnter.classList.add('active'), 8800);
    }
    runIntroTimeline();

    function pulseTri(el) {
      el.classList.add('lit', 'pressed');
      setTimeout(() => el.classList.remove('pressed'), 160);
    }

    function pulseChip() {
      coreChip.classList.add('pressed');
      const rect = coreChip.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      spawnPlasmaShockwave(cx, cy);

      setTimeout(() => coreChip.classList.remove('pressed'), 180);
    }

    // Tùy chọn bấm tay
    function triggerTri(el) { pulseTri(el); }
    function triggerCoreChip() { pulseChip(); }

    // Nhảy tới khung hình cuối ngay tức thì
    function skipToFinalFrame() {
      introTimers.forEach(clearTimeout);
      cornerTL.classList.add('active');
      sparkRing.classList.add('spinning');
      triTop.classList.add('lit');
      triBL.classList.add('lit');
      triBR.classList.add('lit');
      document.querySelectorAll('.conduit-wire').forEach(w => w.classList.add('active'));
      vnColored.classList.add('spread');
      cornerTR.classList.add('active');
      cornerBL.classList.add('active');
      cornerBR.classList.add('active');
      btnEnter.classList.add('active');
      btnSkip.style.display = 'none';
    }

    // Chuyển sang Web App chính
    function goToMainApp() {
      const intro = document.getElementById('intro-screen');
      intro.classList.add('finished');
      setTimeout(() => {
        intro.style.display = 'none';
        const app = document.getElementById('main-app');
        app.classList.add('active');
      }, 600);
    }


    /* ========================================================
       PHẦN 2: MASCOT LINH HOẠT 60FPS & ĐIỂM DANH
       ======================================================== */
    const isGAS = typeof google !== 'undefined' && google.script && google.script.run;
    function callGAS(funcName, ...args) {
      return new Promise((resolve, reject) => {
        if (!isGAS) {
          setTimeout(() => {
            if (funcName === 'apiLogin') {
              const [cls, pin] = args;
              if (pin === '000000') reject(new Error('Mã PIN không đúng!'));
              else resolve({
                ok: true, cls: cls || '241_71ITEC20203_01',
                students: [
                  { mssv: '21010001', name: 'Nguyễn Văn An' },
                  { mssv: '21010002', name: 'Trần Thị Bích' },
                  { mssv: '21010003', name: 'Lê Hoàng Cường' },
                  { mssv: '21010004', name: 'Phạm Đức Duy' },
                  { mssv: '21010005', name: 'Vũ Ngọc Hân' },
                  { mssv: '21010006', name: 'Đặng Minh Khôi' },
                  { mssv: '21010007', name: 'Bùi Gia Linh' },
                  { mssv: '21010008', name: 'Hoàng Nhật Nam' }
                ]
              });
            } else resolve({ ok: true });
          }, 1000);
          return;
        }
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[funcName](...args);
      });
    }

    const mascotStage = document.getElementById('mascot-stage');
    const mascotInner = document.getElementById('mascot-inner');
    const eyeContainer = document.getElementById('eye-container');
    const irisLeft = document.getElementById('iris-left');
    const irisRight = document.getElementById('iris-right');

    const layers = {
      noeyes: document.getElementById('layer-noeyes'),
      closed: document.getElementById('layer-closed'),
      open: document.getElementById('layer-open'),
      run1: document.getElementById('layer-run1'),
      run2: document.getElementById('layer-run2'),
      cheer: document.getElementById('layer-cheer'),
      point: document.getElementById('layer-point'),
      tilt: document.getElementById('layer-tilt'),
      wave: document.getElementById('layer-wave')
    };

    let targetEyeX = 0, targetEyeY = 0, currentEyeX = 0, currentEyeY = 0;
    let targetHeadTilt = 0, currentHeadTilt = 0;
    const MAX_OFFSET_X = 6.5, MAX_OFFSET_Y = 5.0, LERP_FACTOR = 0.15;
    let isTyping = false, isRunning = false, currentActiveLayer = 'noeyes';

    function setPose(layerKey) {
      if (currentActiveLayer === layerKey) return;
      eyeContainer.style.opacity = (layerKey === 'noeyes') ? '1' : '0';
      Object.keys(layers).forEach(k => { if (layers[k]) layers[k].classList.remove('active'); });
      if (layers[layerKey]) {
        layers[layerKey].classList.add('active');
        currentActiveLayer = layerKey;
      }
    }

    function renderMascotFrame() {
      currentEyeX += (targetEyeX - currentEyeX) * LERP_FACTOR;
      currentEyeY += (targetEyeY - currentEyeY) * LERP_FACTOR;
      currentHeadTilt += (targetHeadTilt - currentHeadTilt) * 0.08;

      const eyeTransform = `translate3d(${currentEyeX.toFixed(2)}px, ${currentEyeY.toFixed(2)}px, 0)`;
      irisLeft.style.transform = eyeTransform;
      irisRight.style.transform = eyeTransform;
      mascotInner.style.transform = `rotate(${currentHeadTilt.toFixed(2)}deg)`;

      requestAnimationFrame(renderMascotFrame);
    }
    requestAnimationFrame(renderMascotFrame);

    window.addEventListener('mousemove', (e) => {
      if (isTyping || isRunning) return;
      const rect = mascotStage.getBoundingClientRect();
      const mascotCenterX = rect.left + rect.width / 2;
      const mascotCenterY = rect.top + rect.height * 0.42;

      const dx = e.clientX - mascotCenterX;
      const dy = e.clientY - mascotCenterY;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist > 0) {
        const factor = Math.min(dist / 320, 1);
        targetEyeX = (dx / dist) * MAX_OFFSET_X * factor;
        targetEyeY = (dy / dist) * MAX_OFFSET_Y * factor;
        targetHeadTilt = Math.max(-3, Math.min(3, (dx / 320) * 3));
      }
    });

    function scheduleBlink() {
      const interval = Math.random() * 2000 + 3000;
      setTimeout(() => {
        if (!isRunning && currentActiveLayer === 'noeyes') {
          layers.closed.classList.add('active');
          eyeContainer.style.opacity = '0';
          setTimeout(() => {
            layers.closed.classList.remove('active');
            eyeContainer.style.opacity = '1';
            scheduleBlink();
          }, 130);
        } else {
          scheduleBlink();
        }
      }, interval);
    }
    scheduleBlink();

    function trackInputCaret(input) {
      if (isRunning) return;
      isTyping = true;
      const rect = input.getBoundingClientRect();
      const mascotRect = mascotStage.getBoundingClientRect();
      const mascotCenterX = mascotRect.left + mascotRect.width / 2;
      const mascotCenterY = mascotRect.top + mascotRect.height * 0.42;

      const caretX = rect.left + Math.min(input.selectionStart * 9.5, rect.width - 24) + 16;
      const caretY = rect.top + rect.height / 2;

      const dx = caretX - mascotCenterX;
      const dy = caretY - mascotCenterY;
      const dist = Math.sqrt(dx * dx + dy * dy);

      targetEyeX = Math.max(-MAX_OFFSET_X, Math.min(MAX_OFFSET_X, (dx / dist) * MAX_OFFSET_X));
      targetEyeY = Math.max(-MAX_OFFSET_Y, Math.min(MAX_OFFSET_Y, (dy / dist) * MAX_OFFSET_Y));
      targetHeadTilt = (dx / 400) * 2.5;

      clearTimeout(input._typingTimer);
      input._typingTimer = setTimeout(() => { isTyping = false; }, 1200);
    }

    const classInput = document.getElementById('class-code');
    const pinInput = document.getElementById('pin-code');
    [classInput, pinInput].forEach(inp => {
      inp.addEventListener('input', () => trackInputCaret(inp));
      inp.addEventListener('focus', () => trackInputCaret(inp));
      inp.addEventListener('blur', () => { setTimeout(() => { isTyping = false; }, 200); });
    });

    const savedClass = localStorage.getItem('siu_class_code');
    if (savedClass) {
      classInput.value = savedClass;
      document.getElementById('remember-me').checked = true;
    }

    let runInterval = null;
    async function handleLogin(e) {
      e.preventDefault();
      const cls = classInput.value.trim();
      const pin = pinInput.value.trim();
      const remember = document.getElementById('remember-me').checked;

      if (remember) localStorage.setItem('siu_class_code', cls);
      else localStorage.removeItem('siu_class_code');

      const btn = document.getElementById('btn-login');
      const notice = document.getElementById('loading-notice');
      const errBox = document.getElementById('error-msg');
      errBox.style.display = 'none';
      btn.disabled = true;
      notice.style.display = 'block';

      isRunning = true;
      let step = 0;
      setPose('run1');
      runInterval = setInterval(() => {
        step = 1 - step;
        setPose(step === 0 ? 'run1' : 'run2');
      }, 180);

      try {
        const res = await callGAS('apiLogin', cls, pin);
        clearInterval(runInterval);
        isRunning = false;

        mascotStage.classList.add('mascot-squash');
        setPose('cheer');
        setTimeout(() => mascotStage.classList.remove('mascot-squash'), 220);

        setTimeout(() => {
          document.getElementById('login-container').style.display = 'none';
          initAttendanceDashboard(res);
        }, 550);

      } catch (err) {
        clearInterval(runInterval);
        isRunning = false;
        btn.disabled = false;
        notice.style.display = 'none';

        setPose('tilt');
        const card = document.getElementById('login-card');
        card.classList.add('shake');
        errBox.textContent = err.message || 'Mã lớp hoặc PIN không đúng!';
        errBox.style.display = 'block';

        setTimeout(() => {
          card.classList.remove('shake');
          setPose('noeyes');
        }, 1200);
      }
    }

    let studentData = [], attendanceMap = {};
    function initAttendanceDashboard(data) {
      const screen = document.getElementById('attendance-screen');
      screen.classList.add('active');
      document.getElementById('select-date').valueAsDate = new Date();
      document.getElementById('dash-class-name').textContent = `Lớp: ${data.cls}`;
      studentData = data.students || [];
      document.getElementById('dash-total').textContent = studentData.length;
      renderStudentList(studentData);
      updateStats();
    }

    function renderStudentList(list) {
      const container = document.getElementById('student-list-container');
      container.innerHTML = '';
      list.forEach(stu => {
        const item = document.createElement('div');
        item.className = 'student-item';
        const currentStatus = attendanceMap[stu.mssv] || '';
        item.innerHTML = `
          <div class="student-info">
            <span style="font-size: 14.5px; font-weight: 700; color: #0f172a;">${stu.name}</span>
            <span style="font-size: 12.5px; color: #64748b; font-weight: 500;">${stu.mssv}</span>
          </div>
          <div style="display: flex; gap: 8px;">
            <button class="btn-att kp ${currentStatus === 'KP' ? 'active' : ''}" onclick="toggleStatus('${stu.mssv}', 'KP')">Không phép</button>
            <button class="btn-att cp ${currentStatus === 'CP' ? 'active' : ''}" onclick="toggleStatus('${stu.mssv}', 'CP')">Có phép</button>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function toggleStatus(mssv, type) {
      if (attendanceMap[mssv] === type) delete attendanceMap[mssv];
      else attendanceMap[mssv] = type;
      filterStudents();
      updateStats();
    }

    function updateStats() {
      let kp = 0, cp = 0;
      Object.values(attendanceMap).forEach(v => {
        if (v === 'KP') kp++;
        if (v === 'CP') cp++;
      });
      const present = studentData.length - (kp + cp);
      document.getElementById('stat-present').textContent = present;
      document.getElementById('stat-kp').textContent = kp;
      document.getElementById('stat-cp').textContent = cp;
    }

    function filterStudents() {
      const q = document.getElementById('search-student').value.toLowerCase().trim();
      const filtered = studentData.filter(s => s.name.toLowerCase().includes(q) || s.mssv.includes(q));
      renderStudentList(filtered);
    }

    function resetAllAbsent() {
      attendanceMap = {};
      filterStudents();
      updateStats();
    }

    function reportWrongList() {
      const note = prompt('Nhập phản ánh hoặc lỗi danh sách lớp:');
      if (note) callGAS('apiReportWrong', classInput.value, note).then(() => alert('Đã gửi phản ánh!'));
    }

    async function submitAttendance() {
      const absentList = Object.keys(attendanceMap).map(mssv => ({ mssv, type: attendanceMap[mssv] }));
      const payload = {
        classCode: classInput.value,
        session: document.getElementById('select-session').value,
        status: document.getElementById('select-status').value,
        date: document.getElementById('select-date').value,
        absent: absentList
      };
      try {
        await callGAS('apiSubmit', payload);
        alert('🎉 Đã lưu kết quả điểm danh thành công!');
      } catch (err) {
        alert('Lỗi: ' + err.message);
      }
    }

    function logout() {
      document.getElementById('attendance-screen').classList.remove('active');
      document.getElementById('login-container').style.display = 'block';
      document.getElementById('btn-login').disabled = false;
      document.getElementById('loading-notice').style.display = 'none';
      setPose('noeyes');
    }
  </script>
</body>
</html>
