<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SIU - Sài Gòn International University</title>
  <style>
    :root {
      --bg: #000000;
      --cyan: #00f3ff;
      --cyan-bright: #80f9ff;
      --cyan-glow: rgba(0, 243, 255, 0.75);
      --red-flag: #da251d;
      --gold-star: #ffeb3b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: #ffffff;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Màn hình Boot Cinema nền đen */
    #boot-cinema {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      overflow: hidden;
      transition: opacity 0.6s ease;
    }

    /* Lưới vi mạch nhẹ ẩn dưới nền đen */
    .cyber-grid {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: 
        radial-gradient(circle at center, rgba(0, 243, 255, 0.08) 0%, transparent 65%),
        linear-gradient(rgba(0, 243, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 243, 255, 0.04) 1px, transparent 1px);
      background-size: 100% 100%, 40px 40px, 40px 40px;
      pointer-events: none;
    }

    /* Canvas vẽ các tia điện sét sống động */
    #lightning-canvas {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 35;
    }

    /* ========================================================
       1. GÓC TRÊN TRÁI: LOGO SIU HIỆN THEO VÒNG TRÒN XOAY + TIA LỬA
       ======================================================== */
    .hud-corner {
      position: absolute;
      z-index: 40;
    }

    .corner-tl {
      top: max(16px, 3.5vmin);
      left: max(16px, 3.5vmin);
    }

    .siu-orbit-box {
      position: relative;
      width: clamp(74px, 13vmin, 105px);
      height: clamp(74px, 13vmin, 105px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .siu-orbit-box svg {
      position: absolute;
      width: 100%; height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    /* Vòng tròn vẽ nét từng phần theo chiều kim đồng hồ */
    .circle-reveal-stroke {
      stroke: var(--cyan);
      stroke-width: 2.8;
      fill: none;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      filter: drop-shadow(0 0 8px var(--cyan)) drop-shadow(0 0 15px var(--cyan-glow));
      animation: drawCircleClockwise 2s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
      transform-origin: center;
    }

    @keyframes drawCircleClockwise {
      to { stroke-dashoffset: 0; }
    }

    /* Tia lửa điện ở ngoài vòng tròn xoay liên tục không ngừng */
    .electric-orbit-ring {
      stroke: var(--cyan-bright);
      stroke-width: 1.8;
      stroke-dasharray: 8 16;
      fill: none;
      opacity: 0;
      transform-origin: center;
      animation: electricSpin 5s linear infinite;
      filter: drop-shadow(0 0 6px var(--cyan));
    }

    .electric-orbit-ring.active {
      opacity: 0.95;
      transition: opacity 0.4s ease;
    }

    @keyframes electricSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Đốm plasma chạy quanh vòng */
    .plasma-node {
      position: absolute;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 10px var(--cyan), 0 0 18px var(--cyan);
      opacity: 0;
      pointer-events: none;
    }

    .plasma-node.active {
      opacity: 1;
      animation: nodeOrbit 3.2s linear infinite;
    }

    @keyframes nodeOrbit {
      from { transform: rotate(0deg) translate(clamp(37px, 6.5vmin, 52px)) rotate(0deg); }
      to { transform: rotate(360deg) translate(clamp(37px, 6.5vmin, 52px)) rotate(-360deg); }
    }

    .siu-logo-inner {
      width: 64%;
      height: 64%;
      object-fit: contain;
      border-radius: 50%;
      opacity: 0;
      transform: scale(0.82) rotate(-15deg);
      filter: drop-shadow(0 0 10px rgba(0, 243, 255, 0.5));
      animation: logoPopIn 1.8s cubic-bezier(0.16, 1, 0.3, 1) 0.7s forwards;
    }

    @keyframes logoPopIn {
      to {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    /* ========================================================
       2. GÓC TRÊN PHẢI: LÁ CỜ VIỆT NAM CHUẨN ĐỎ SAO VÀNG
       ======================================================== */
    .corner-tr {
      top: max(16px, 3.5vmin);
      right: max(16px, 3.5vmin);
      opacity: 0;
      transform: translate(12px, -12px);
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .corner-tr.active {
      opacity: 1;
      transform: translate(0, 0);
    }

    .flag-vietnam-card {
      width: clamp(54px, 9vmin, 82px);
      height: clamp(36px, 6vmin, 54px);
      background: var(--red-flag);
      border-radius: 5px;
      box-shadow: 0 0 25px rgba(218, 37, 29, 0.6), 0 0 8px rgba(255, 235, 59, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .flag-vietnam-card svg {
      width: 45%;
      height: 45%;
      fill: var(--gold-star);
      filter: drop-shadow(0 0 6px var(--gold-star));
    }

    /* ========================================================
       3. GÓC DƯỚI TRÁI: LOGO QUỐC TẾ
       ======================================================== */
    .corner-bl {
      bottom: max(16px, 3.5vmin);
      left: max(16px, 3.5vmin);
      display: flex;
      align-items: center;
      gap: 12px;
      opacity: 0;
      transform: translate(-12px, 12px);
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .corner-bl.active {
      opacity: 1;
      transform: translate(0, 0);
    }

    .intl-globe {
      width: clamp(36px, 6.2vmin, 48px);
      height: clamp(36px, 6.2vmin, 48px);
      border-radius: 50%;
      border: 1.5px solid var(--cyan);
      box-shadow: 0 0 16px var(--cyan-glow);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: spinGlobe 12s linear infinite;
    }

    @keyframes spinGlobe {
      to { transform: rotate(360deg); }
    }

    .intl-globe::before {
      content: "";
      position: absolute;
      width: 44%; height: 100%;
      border-radius: 50%;
      border: 1px dashed var(--cyan);
    }

    .intl-globe::after {
      content: "";
      position: absolute;
      width: 100%; height: 44%;
      border-radius: 50%;
      border: 1px dashed var(--cyan);
    }

    .intl-text {
      display: flex;
      flex-direction: column;
    }

    .intl-main {
      font-size: clamp(11px, 2vmin, 13px);
      font-weight: 800;
      letter-spacing: 2px;
      color: #e2e8f0;
      text-transform: uppercase;
    }

    .intl-sub {
      font-size: 9px;
      color: var(--cyan);
      letter-spacing: 1.5px;
      font-weight: 600;
    }

    /* ========================================================
       4. GÓC DƯỚI PHẢI: CHỮ "ASEAN NATIONAL CEO"
       ======================================================== */
    .corner-br {
      bottom: max(16px, 3.5vmin);
      right: max(16px, 3.5vmin);
      text-align: right;
      opacity: 0;
      transform: translate(12px, 12px);
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .corner-br.active {
      opacity: 1;
      transform: translate(0, 0);
    }

    .asean-main {
      font-size: clamp(20px, 3.5vmin, 28px);
      font-weight: 900;
      letter-spacing: 6px;
      background: linear-gradient(135deg, #ffffff 0%, var(--cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(0, 243, 255, 0.45);
    }

    .asean-sub-text {
      font-size: clamp(9px, 1.5vmin, 11px);
      letter-spacing: 4px;
      color: #94a3b8;
      font-weight: 700;
      margin-top: 2px;
    }

    /* ========================================================
       5. CHIP TRUNG TÂM + 3 TAM GIÁC + CÁC ĐƯỜNG DÂY CHÍNH
       ======================================================== */
    .center-mecha-stage {
      position: relative;
      width: min(85vw, 420px);
      height: min(85vw, 420px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }

    /* SVG 4 DÂY CHÍNH TỎA ĐI BỐN GÓC */
    #wires-svg-layer {
      position: absolute;
      top: -100vh; left: -100vw;
      width: 300vw; height: 300vh;
      pointer-events: none;
      z-index: 10;
    }

    .cable-wire {
      stroke: var(--cyan);
      stroke-width: 2.5;
      fill: none;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      filter: drop-shadow(0 0 8px var(--cyan)) drop-shadow(0 0 16px var(--cyan));
      transition: stroke-dashoffset 1.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .cable-wire.charged {
      stroke-dashoffset: 0;
    }

    /* Chip trung tâm dạng hình vuông bo góc vi mạch */
    .central-chip {
      width: clamp(88px, 16vmin, 125px);
      height: clamp(88px, 16vmin, 125px);
      background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
      border: 2px solid var(--cyan);
      border-radius: 26px;
      box-shadow: 0 0 35px var(--cyan-glow), inset 0 0 20px rgba(0, 243, 255, 0.35);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 25;
      cursor: pointer;
      transition: transform 0.16s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s ease;
    }

    .central-chip.armor-pressed {
      transform: scale(0.88);
      box-shadow: 0 0 75px var(--cyan), inset 0 0 40px var(--cyan);
    }

    .central-chip img {
      width: 60%;
      height: 60%;
      object-fit: contain;
      filter: drop-shadow(0 0 8px rgba(0, 243, 255, 0.7));
      pointer-events: none;
    }

    /* 3 Tam giác robot ấn vào */
    .tri-armor-plate {
      position: absolute;
      width: clamp(34px, 6.5vmin, 44px);
      height: clamp(34px, 6.5vmin, 44px);
      z-index: 22;
      cursor: pointer;
      transition: transform 0.16s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .tri-armor-plate svg {
      width: 100%; height: 100%;
      overflow: visible;
    }

    .tri-armor-plate polygon {
      fill: #091322;
      stroke: var(--cyan);
      stroke-width: 2.5;
      filter: drop-shadow(0 0 4px var(--cyan));
      transition: all 0.2s ease;
    }

    .tri-armor-plate.lit polygon {
      fill: var(--cyan);
      filter: drop-shadow(0 0 18px var(--cyan)) drop-shadow(0 0 30px #ffffff);
    }

    .tri-armor-plate.pressed {
      transform: scale(0.82) !important;
    }

    .tri-pos-top {
      top: 14%; left: 50%;
      transform: translateX(-50%);
    }

    .tri-pos-bl {
      bottom: 18%; left: 18%;
      transform: rotate(-120deg);
    }

    .tri-pos-br {
      bottom: 18%; right: 18%;
      transform: rotate(120deg);
    }

    /* ========================================================
       6. CHỮ "VIỆT NAM": TÔ BẰNG VẾT SƠN / DẦU LOANG
       ======================================================== */
    .vn-oil-container {
      position: absolute;
      bottom: max(60px, 9.5vmin);
      left: 50%;
      transform: translateX(-50%);
      width: max-content;
      text-align: center;
      z-index: 30;
      pointer-events: none;
    }

    .vn-label {
      font-size: clamp(26px, 5.2vmin, 44px);
      font-weight: 900;
      letter-spacing: clamp(6px, 1.6vmin, 15px);
      text-transform: uppercase;
      user-select: none;
      white-space: nowrap;
    }

    /* Chữ viết sẵn nhưng màu tối chìm vào nền đen */
    .vn-dark-base {
      color: #1e293b;
      opacity: 0.55;
    }

    /* Vết sơn/dầu loang tô lên chữ rực rỡ khi tia điện chạm tới */
    .vn-oil-spread {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(135deg, #ef4444 0%, #f59e0b 50%, #facc15 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 25px rgba(245, 158, 11, 0.8)) drop-shadow(0 0 45px rgba(239, 68, 68, 0.5));
      clip-path: circle(0% at 50% 0%);
      transition: clip-path 1.9s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .vn-oil-spread.spread-active {
      clip-path: circle(160% at 50% 0%);
    }

    /* Nút Bỏ Qua & Vào Trang Chính */
    .btn-enter-hub {
      position: absolute;
      bottom: max(16px, 3vmin);
      left: 50%;
      transform: translateX(-50%);
      height: 46px;
      padding: 0 32px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--cyan) 0%, #2563eb 100%);
      color: #000000;
      font-size: 14.5px;
      font-weight: 800;
      letter-spacing: 1.5px;
      border: none;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.7);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 50;
      white-space: nowrap;
    }

    .btn-enter-hub.active {
      opacity: 1;
      pointer-events: auto;
    }

    .btn-enter-hub:hover {
      transform: translateX(-50%) scale(1.06);
      box-shadow: 0 0 45px var(--cyan);
    }

    .btn-skip-intro {
      position: absolute;
      bottom: max(12px, 2.5vmin);
      right: max(16px, 3vmin);
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #94a3b8;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 11.5px;
      cursor: pointer;
      z-index: 60;
      opacity: 0;
      transition: all 0.3s;
    }

    .btn-skip-intro.active {
      opacity: 0.7;
    }

    .btn-skip-intro:hover {
      opacity: 1;
      border-color: var(--cyan);
      color: #ffffff;
    }

    /* ========================================================
       PHẦN 2: WEB APP CHÍNH (MASCOT 60FPS + ĐIỂM DANH)
       ======================================================== */
    #app-container {
      display: none;
      opacity: 0;
      min-height: 100vh;
      width: 100%;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      position: relative;
      background: radial-gradient(circle at 50% 15%, #1e1b4b 0%, #0c1222 55%, #000000 100%);
      transition: opacity 0.5s ease;
      overflow-y: auto;
    }

    #app-container.active {
      display: flex;
      opacity: 1;
    }

    .card-wrap {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 10;
    }

    .mascot-stage {
      position: relative;
      width: 250px;
      height: 250px;
      margin: 0 auto -28px auto;
      z-index: 20;
      pointer-events: none;
      animation: catBreath 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      transform-origin: bottom center;
    }

    @keyframes catBreath {
      0%, 100% { transform: translateY(0px) scale(1, 1); }
      50% { transform: translateY(-4px) scale(1.012, 0.992); }
    }

    .mascot-squash {
      transform: scale(1.04, 0.95) translateY(3px) !important;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .mascot-inner {
      position: relative;
      width: 100%; height: 100%;
      transform-origin: 50% 75%;
    }

    .sprite-layer {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      object-fit: contain;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.18s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .sprite-layer.active { opacity: 1; }

    .eye-layer-container {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 5;
      transition: opacity 0.15s ease;
    }

    .eye-socket {
      position: absolute;
      width: 10.15%; height: 10.15%;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .eye-socket.left { left: 35.15%; top: 38.08%; }
    .eye-socket.right { left: 54.68%; top: 38.08%; }

    .iris-pupil {
      position: absolute;
      width: 80%; height: 80%;
      object-fit: contain;
      border-radius: 50%;
      filter: drop-shadow(0 0 2px rgba(30, 58, 138, 0.45));
    }

    .card {
      background: rgba(255, 255, 255, 0.96);
      border-radius: 32px;
      box-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.5), 0 0 40px rgba(37, 99, 235, 0.2);
      padding: 40px 32px 32px 32px;
      backdrop-filter: blur(20px);
      border: 1.5px solid rgba(255, 255, 255, 0.8);
      color: #0f172a;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(37, 99, 235, 0.08);
      border: 1px solid rgba(37, 99, 235, 0.18);
      padding: 6px 16px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    .brand-badge img { width: 22px; height: 22px; object-fit: contain; }
    .brand-badge span {
      font-size: 12.5px;
      font-weight: 700;
      color: #2563eb;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .input-wrapper input {
      width: 100%;
      height: 52px;
      padding: 0 18px;
      border-radius: 16px;
      border: 1.5px solid #e2e8f0;
      background: #f8fafc;
      font-size: 15px;
      font-weight: 600;
      color: #0f172a;
      outline: none;
      transition: all 0.2s;
    }

    .input-wrapper input:focus {
      border-color: #2563eb;
      background: #ffffff;
      box-shadow: 0 0 0 4.5px rgba(37, 99, 235, 0.14);
    }

    .btn-submit {
      width: 100%;
      height: 54px;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: white;
      border: none;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 24px -4px rgba(37, 99, 235, 0.45);
      transition: all 0.2s;
    }

    /* Màn điểm danh */
    #attendance-screen {
      display: none;
      width: 100%;
      max-width: 620px;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 32px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
      padding: 28px 26px;
      color: #0f172a;
      z-index: 10;
    }

    #attendance-screen.active {
      display: block;
      animation: screenIn 0.35s ease-out forwards;
    }

    @keyframes screenIn {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }

    .btn-att {
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      border: 1.5px solid transparent;
      cursor: pointer;
    }
    .btn-att.kp { background: #fee2e2; color: #dc2626; }
    .btn-att.kp.active { background: #dc2626; color: #fff; }
    .btn-att.cp { background: #fef3c7; color: #d97706; }
    .btn-att.cp.active { background: #d97706; color: #fff; }
  </style>
</head>
<body>

  <!-- ==================== MÀN HÌNH INTRO CINEMATIC (BOOT KHỞI ĐỘNG) ==================== -->
  <div id="boot-cinema">
    <div class="cyber-grid"></div>
    <canvas id="lightning-canvas"></canvas>

    <!-- 1. GÓC TRÁI TRÊN: LOGO SIU HIỆN VÒNG XOAY + TIA LỬA ĐIỆN XOAY LIÊN TỤC -->
    <div class="hud-corner corner-tl">
      <div class="siu-orbit-box">
        <svg viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="45" pathLength="100" class="circle-reveal-stroke" />
          <circle cx="50" cy="50" r="48" class="electric-orbit-ring" id="electric-orbit-ring" />
        </svg>
        <div class="plasma-node" id="plasma-node"></div>
        <img src="assets/logo.png" class="siu-logo-inner" alt="SIU Logo">
      </div>
    </div>

    <!-- 2. GÓC PHẢI TRÊN: LÁ CỜ VIỆT NAM -->
    <div class="hud-corner corner-tr" id="corner-tr">
      <div class="flag-vietnam-card">
        <svg viewBox="0 0 100 100">
          <polygon points="50,15 61.7,43.3 92.4,43.3 67.5,61.4 77.1,89.7 50,72.2 22.9,89.7 32.5,61.4 7.6,43.3 38.3,43.3" />
        </svg>
      </div>
    </div>

    <!-- 3. GÓC TRÁI DƯỚI: LOGO QUỐC TẾ -->
    <div class="hud-corner corner-bl" id="corner-bl">
      <div class="intl-globe"></div>
      <div class="intl-text">

  <!-- ==================== JAVASCRIPT ==================== -->
  <script>
    /* ========================================================
       1. HỆ THỐNG TIA LỬA ĐIỆN VÀ TIMELINE INTRO SCI-FI
       ======================================================== */
    const canvas = document.getElementById('lightning-canvas');
    const ctx = canvas.getContext('2d');
    let sparks = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class ElectricArc {
      constructor(x, y, angle, speed, color) {
        this.x = x; this.y = y;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.color = color;
        this.alpha = 1;
        this.decay = Math.random() * 0.03 + 0.02;
        this.length = Math.random() * 16 + 8;
      }
      update() {
        this.x += this.vx; this.y += this.vy;
        this.alpha -= this.decay;
      }
      draw(c) {
        if (this.alpha <= 0) return;
        c.save();
        c.globalAlpha = this.alpha;
        c.strokeStyle = this.color;
        c.lineWidth = 2.2;
        c.shadowBlur = 10;
        c.shadowColor = this.color;
        c.beginPath();
        c.moveTo(this.x, this.y);
        c.lineTo(this.x - this.vx * (this.length / 4.5), this.y - this.vy * (this.length / 4.5));
        c.stroke();
        c.restore();
      }
    }

    function burstPlasmaArcs(cx, cy) {
      for (let i = 0; i < 40; i++) {
        const angle = (Math.PI * 2 / 40) * i + (Math.random() - 0.5) * 0.25;
        const speed = Math.random() * 8 + 4;
        const color = Math.random() > 0.25 ? '#00f3ff' : '#ffffff';
        sparks.push(new ElectricArc(cx, cy, angle, speed, color));
      }
    }

    function loopSparks() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = sparks.length - 1; i >= 0; i--) {
        sparks[i].update();
        sparks[i].draw(ctx);
        if (sparks[i].alpha <= 0) sparks.splice(i, 1);
      }
      requestAnimationFrame(loopSparks);
    }
    requestAnimationFrame(loopSparks);

    // QUẢN LÝ DÒNG THỜI GIAN THEO ĐÚNG MÔ TẢ CỦA BẠN
    const timers = [];
    function wait(fn, ms) {
      const id = setTimeout(fn, ms);
      timers.push(id);
      return id;
    }

    const electricRing = document.getElementById('electric-orbit-ring');
    const plasmaNode = document.getElementById('plasma-node');
    const triTop = document.getElementById('tri-top');
    const triBL = document.getElementById('tri-bl');
    const triBR = document.getElementById('tri-br');
    const centralChip = document.getElementById('central-chip');
    const vnOilSpread = document.getElementById('vn-oil-spread');
    const cornerTR = document.getElementById('corner-tr');
    const cornerBL = document.getElementById('corner-bl');
    const cornerBR = document.getElementById('corner-br');
    const btnEnter = document.getElementById('btn-enter-hub');
    const btnSkip = document.getElementById('btn-skip-intro');

    function startCinematicIntro() {
      wait(() => btnSkip.classList.add('active'), 1000);

      // 1. Logo vẽ xong thì tia lửa điện ở ngoài vòng tròn xoay liên tục
      wait(() => {
        electricRing.classList.add('active');
        plasmaNode.classList.add('active');
      }, 2400);

      // 2. Ba tam giác của robot ấn vào
      wait(() => pressTri(triTop), 3000);
      wait(() => pressTri(triBL), 3450);
      wait(() => pressTri(triBR), 3900);

      // 3. Tấm giáp ấn vào -> Chip có tia lửa điện lan ra xung quanh
      wait(() => pressCoreChip(), 4350);

      // 4. Các dây chính lan tới 4 góc
      wait(() => {
        document.getElementById('wire-tl').classList.add('charged');
        document.getElementById('wire-tr').classList.add('charged');
        document.getElementById('wire-bl').classList.add('charged');
        document.getElementById('wire-br').classList.add('charged');
      }, 4800);

      // 5. Tia lửa điện vừa chạm tới chữ VIỆT NAM -> vết sơn/dầu loang tô lên chữ
      wait(() => {
        vnOilSpread.classList.add('spread-active');
      }, 6400);

      // 6. Hiện các góc: Cờ Việt Nam, ASEAN National CEO, Logo Quốc Tế
      wait(() => cornerTR.classList.add('active'), 7200);
      wait(() => cornerBL.classList.add('active'), 7550);
      wait(() => cornerBR.classList.add('active'), 7900);

      // 7. Hoàn tất: Nút vào trang chính
      wait(() => btnEnter.classList.add('active'), 8600);
    }
    startCinematicIntro();

    function pressTri(el) {
      el.classList.add('lit', 'pressed');
      setTimeout(() => el.classList.remove('pressed'), 180);
    }

    function pressCoreChip() {
      centralChip.classList.add('armor-pressed');
      const r = centralChip.getBoundingClientRect();
      burstPlasmaArcs(r.left + r.width / 2, r.top + r.height / 2);
      setTimeout(() => centralChip.classList.remove('armor-pressed'), 200);
    }

    function skipToFinish() {
      timers.forEach(clearTimeout);
      electricRing.classList.add('active');
      plasmaNode.classList.add('active');
      triTop.classList.add('lit');
      triBL.classList.add('lit');
      triBR.classList.add('lit');
      document.querySelectorAll('.cable-wire').forEach(w => w.classList.add('charged'));
      vnOilSpread.classList.add('spread-active');
      cornerTR.classList.add('active');
      cornerBL.classList.add('active');
      cornerBR.classList.add('active');
      btnEnter.classList.add('active');
      btnSkip.style.display = 'none';
    }

    function openWebApp() {
      const cinema = document.getElementById('boot-cinema');
      cinema.style.opacity = '0';
      setTimeout(() => {
        cinema.style.display = 'none';
        document.getElementById('app-container').classList.add('active');
      }, 550);
    }


    /* ========================================================
       2. MASCOT LINH HOẠT 60FPS & ĐIỂM DANH
       ======================================================== */
    const isGAS = typeof google !== 'undefined' && google.script && google.script.run;
    function callGAS(funcName, ...args) {
      return new Promise((resolve, reject) => {
        if (!isGAS) {
          setTimeout(() => {
            if (funcName === 'apiLogin') {
              const [cls, pin] = args;
              if (pin === '000000') reject(new Error('Mã PIN không đúng!'));
              else resolve({
                ok: true, cls: cls || '241_71ITEC20203_01',
                students: [
                  { mssv: '21010001', name: 'Nguyễn Văn An' },
                  { mssv: '21010002', name: 'Trần Thị Bích' },
                  { mssv: '21010003', name: 'Lê Hoàng Cường' },
                  { mssv: '21010004', name: 'Phạm Đức Duy' },
                  { mssv: '21010005', name: 'Vũ Ngọc Hân' },
                  { mssv: '21010006', name: 'Đặng Minh Khôi' },
                  { mssv: '21010007', name: 'Bùi Gia Linh' },
                  { mssv: '21010008', name: 'Hoàng Nhật Nam' }
                ]
              });
            } else resolve({ ok: true });
          }, 1000);
          return;
        }
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[funcName](...args);
      });
    }

    const mascotStage = document.getElementById('mascot-stage');
    const mascotInner = document.getElementById('mascot-inner');
    const eyeContainer = document.getElementById('eye-container');
    const irisLeft = document.getElementById('iris-left');
    const irisRight = document.getElementById('iris-right');

    const layers = {
      noeyes: document.getElementById('layer-noeyes'),
      closed: document.getElementById('layer-closed'),
      open: document.getElementById('layer-open'),
      run1: document.getElementById('layer-run1'),
      run2: document.getElementById('layer-run2'),
      cheer: document.getElementById('layer-cheer'),
      point: document.getElementById('layer-point'),
      tilt: document.getElementById('layer-tilt'),
      wave: document.getElementById('layer-wave')
    };

    let targetEyeX = 0, targetEyeY = 0, currentEyeX = 0, currentEyeY = 0;
    let targetHeadTilt = 0, currentHeadTilt = 0;
    const MAX_OFFSET_X = 6.5, MAX_OFFSET_Y = 5.0, LERP_FACTOR = 0.15;
    let isTyping = false, isRunning = false, currentActiveLayer = 'noeyes';

    function setPose(k) {
      if (currentActiveLayer === k) return;
      eyeContainer.style.opacity = (k === 'noeyes') ? '1' : '0';
      Object.keys(layers).forEach(name => { if (layers[name]) layers[name].classList.remove('active'); });
      if (layers[k]) { layers[k].classList.add('active'); currentActiveLayer = k; }
    }

    function renderFrame() {
      currentEyeX += (targetEyeX - currentEyeX) * LERP_FACTOR;
      currentEyeY += (targetEyeY - currentEyeY) * LERP_FACTOR;
      currentHeadTilt += (targetHeadTilt - currentHeadTilt) * 0.08;

      const t = `translate3d(${currentEyeX.toFixed(2)}px, ${currentEyeY.toFixed(2)}px, 0)`;
      irisLeft.style.transform = t;
      irisRight.style.transform = t;
      mascotInner.style.transform = `rotate(${currentHeadTilt.toFixed(2)}deg)`;
      requestAnimationFrame(renderFrame);
    }
    requestAnimationFrame(renderFrame);

    window.addEventListener('mousemove', (e) => {
      if (isTyping || isRunning) return;
      const r = mascotStage.getBoundingClientRect();
      const cx = r.left + r.width / 2;
      const cy = r.top + r.height * 0.42;
      const dx = e.clientX - cx, dy = e.clientY - cy;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > 0) {
        const factor = Math.min(dist / 320, 1);
        targetEyeX = (dx / dist) * MAX_OFFSET_X * factor;
        targetEyeY = (dy / dist) * MAX_OFFSET_Y * factor;
        targetHeadTilt = Math.max(-3, Math.min(3, (dx / 320) * 3));
      }
    });

    function scheduleBlink() {
      setTimeout(() => {
        if (!isRunning && currentActiveLayer === 'noeyes') {
          layers.closed.classList.add('active');
          eyeContainer.style.opacity = '0';
          setTimeout(() => {
            layers.closed.classList.remove('active');
            eyeContainer.style.opacity = '1';
            scheduleBlink();
          }, 130);
        } else {
          scheduleBlink();
        }
      }, Math.random() * 2000 + 3000);
    }
    scheduleBlink();

    function trackInput(input) {
      if (isRunning) return;
      isTyping = true;
      const r = input.getBoundingClientRect();
      const mr = mascotStage.getBoundingClientRect();
      const cx = mr.left + mr.width / 2;
      const cy = mr.top + mr.height * 0.42;

      const caretX = r.left + Math.min(input.selectionStart * 9.5, r.width - 24) + 16;
      const caretY = r.top + r.height / 2;
      const dx = caretX - cx, dy = caretY - cy;
      const dist = Math.sqrt(dx * dx + dy * dy);

      targetEyeX = Math.max(-MAX_OFFSET_X, Math.min(MAX_OFFSET_X, (dx / dist) * MAX_OFFSET_X));
      targetEyeY = Math.max(-MAX_OFFSET_Y, Math.min(MAX_OFFSET_Y, (dy / dist) * MAX_OFFSET_Y));
      targetHeadTilt = (dx / 400) * 2.5;

      clearTimeout(input._timer);
      input._timer = setTimeout(() => { isTyping = false; }, 1200);
    }

    const classInput = document.getElementById('class-code');
    const pinInput = document.getElementById('pin-code');
    [classInput, pinInput].forEach(inp => {
      inp.addEventListener('input', () => trackInput(inp));
      inp.addEventListener('focus', () => trackInput(inp));
      inp.addEventListener('blur', () => { setTimeout(() => { isTyping = false; }, 200); });
    });

    let runTimer = null;
    async function handleLogin(e) {
      e.preventDefault();
      const cls = classInput.value.trim(), pin = pinInput.value.trim();
      const btn = document.getElementById('btn-login');
      const notice = document.getElementById('loading-notice');
      const errBox = document.getElementById('error-msg');
      errBox.style.display = 'none';
      btn.disabled = true;
      notice.style.display = 'block';

      isRunning = true;
      let step = 0;
      setPose('run1');
      runTimer = setInterval(() => {
        step = 1 - step;
        setPose(step === 0 ? 'run1' : 'run2');
      }, 180);

      try {
        const res = await callGAS('apiLogin', cls, pin);
        clearInterval(runTimer);
        isRunning = false;
        mascotStage.classList.add('mascot-squash');
        setPose('cheer');
        setTimeout(() => mascotStage.classList.remove('mascot-squash'), 220);

        setTimeout(() => {
          document.getElementById('login-container').style.display = 'none';
          initAttendance(res);
        }, 550);
      } catch (err) {
        clearInterval(runTimer);
        isRunning = false;
        btn.disabled = false;
        notice.style.display = 'none';
        setPose('tilt');
        document.getElementById('login-card').classList.add('shake');
        errBox.textContent = err.message || 'Mã lớp hoặc PIN không đúng!';
        errBox.style.display = 'block';
        setTimeout(() => {
          document.getElementById('login-card').classList.remove('shake');
          setPose('noeyes');
        }, 1200);
      }
    }

    let studentData = [], attendanceMap = {};
    function initAttendance(data) {
      document.getElementById('attendance-screen').classList.add('active');
      document.getElementById('select-date').valueAsDate = new Date();
      document.getElementById('dash-class-name').textContent = `Lớp: ${data.cls}`;
      studentData = data.students || [];
      document.getElementById('dash-total').textContent = studentData.length;
      renderStudents(studentData);
      updateStats();
    }

    function renderStudents(list) {
      const container = document.getElementById('student-list-container');
      container.innerHTML = '';
      list.forEach(s => {
        const item = document.createElement('div');
        item.style.cssText = 'display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; border-bottom: 1px solid #f1f5f9;';
        const st = attendanceMap[s.mssv] || '';
        item.innerHTML = `
          <div><div style="font-weight: 700; color: #0f172a;">${s.name}</div><div style="font-size: 12.5px; color: #64748b;">${s.mssv}</div></div>
          <div style="display: flex; gap: 8px;">
            <button class="btn-att kp ${st === 'KP' ? 'active' : ''}" onclick="toggleAtt('${s.mssv}', 'KP')">Không phép</button>
            <button class="btn-att cp ${st === 'CP' ? 'active' : ''}" onclick="toggleAtt('${s.mssv}', 'CP')">Có phép</button>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function toggleAtt(mssv, type) {
      if (attendanceMap[mssv] === type) delete attendanceMap[mssv];
      else attendanceMap[mssv] = type;
      filterStudents();
      updateStats();
    }

    function updateStats() {
      let kp = 0, cp = 0;
      Object.values(attendanceMap).forEach(v => { if (v === 'KP') kp++; if (v === 'CP') cp++; });
      document.getElementById('stat-present').textContent = studentData.length - (kp + cp);
      document.getElementById('stat-kp').textContent = kp;
      document.getElementById('stat-cp').textContent = cp;
    }

    function filterStudents() {
      const q = document.getElementById('search-student').value.toLowerCase().trim();
      renderStudents(studentData.filter(s => s.name.toLowerCase().includes(q) || s.mssv.includes(q)));
    }

    function resetAllAbsent() { attendanceMap = {}; filterStudents(); updateStats(); }
    function reportWrongList() {
      const note = prompt('Nhập phản ánh sai danh sách:');
      if (note) callGAS('apiReportWrong', classInput.value, note).then(() => alert('Đã gửi phản ánh!'));
    }

    async function submitAttendance() {
      const absent = Object.keys(attendanceMap).map(mssv => ({ mssv, type: attendanceMap[mssv] }));
      await callGAS('apiSubmit', { classCode: classInput.value, absent });
      alert('🎉 Đã lưu điểm danh thành công!');
    }

    function logout() {
      document.getElementById('attendance-screen').classList.remove('active');
      document.getElementById('login-container').style.display = 'block';
      document.getElementById('btn-login').disabled = false;
      document.getElementById('loading-notice').style.display = 'none';
      setPose('noeyes');
    }
  </script>
</body>
</html>
